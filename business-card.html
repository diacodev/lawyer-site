<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>کارت ویزیت | سمیرا کریمی</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>
@font-face {
  font-family: 'Vazir';
  src: url('./fonts/Vazir.woff2') format('woff2'),
       url('./fonts/Vazir.woff') format('woff');
  font-weight: 400;
  font-display: swap;
}
@font-face {
  font-family: 'Vazir';
  src: url('./fonts/Vazir-Bold.woff2') format('woff2'),
       url('./fonts/Vazir-Bold.woff') format('woff');
  font-weight: 700;
  font-display: swap;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #0a0a0a;
  --text: #f5f0e8;
  --muted: #8a8578;
  --dim: #4a4640;
  --line: rgba(245, 240, 232, 0.08);
  --line-strong: rgba(245, 240, 232, 0.15);
  --gold: #c9a86a;
  --gold-hi: #e8d5a8;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
body {
  font-family: 'Vazir', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  overflow-x: hidden;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 20% 30%, rgba(201, 168, 106, 0.05), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(201, 168, 106, 0.04), transparent 40%);
  z-index: -1;
}
.back-btn {
  position: fixed;
  top: 1.5rem;
  inset-inline-start: 1.5rem;
  color: var(--gold);
  text-decoration: none;
  font-size: 0.85rem;
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.6rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 2px;
  transition: all 0.3s var(--ease);
  letter-spacing: 1px;
}
.back-btn:hover {
  border-color: var(--gold);
  padding-inline-start: 1.5rem;
}
.container {
  perspective: 1400px;
  width: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}
.card-wrap {
  animation: floatCard 6s ease-in-out infinite;
}
@keyframes floatCard {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}
.card {
  width: min(520px, 92vw);
  height: min(310px, 58vw);
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(8deg) rotateY(8deg);
  transition: transform 0.6s var(--ease);
  cursor: pointer;
}
.card.flipped {
  transform: rotateX(8deg) rotateY(188deg);
}
.face {
  position: absolute;
  inset: 0;
  border-radius: 24px;
  overflow: hidden;
  border: 1px solid var(--line-strong);
  background: linear-gradient(145deg, #141311, #0f0e0c);
  backface-visibility: hidden;
  padding: clamp(1.25rem, 4vw, 2rem);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow:
    0 40px 80px -20px rgba(0, 0, 0, 0.8),
    0 0 0 1px rgba(201, 168, 106, 0.15) inset;
}
.face::before {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(115deg,
    transparent 30%,
    rgba(201, 168, 106, 0.08) 50%,
    transparent 70%);
  pointer-events: none;
}
.back { transform: rotateY(180deg); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.logo {
  font-size: clamp(1.5rem, 5vw, 2rem);
  font-weight: 700;
  background: linear-gradient(135deg, var(--gold), var(--gold-hi));
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 2px;
}
.badge {
  font-size: clamp(0.6rem, 2vw, 0.75rem);
  color: var(--gold);
  border: 1px solid var(--line-strong);
  padding: 0.25rem 0.9rem;
  border-radius: 100px;
  letter-spacing: 1px;
}
.card-body { text-align: center; }
.card-name {
  font-size: clamp(1.75rem, 6vw, 2.5rem);
  font-weight: 700;
  color: var(--text);
  margin-bottom: 0.3rem;
}
.card-role {
  font-size: clamp(0.75rem, 2.5vw, 0.95rem);
  color: var(--gold);
  letter-spacing: 2px;
  margin-bottom: 0.9rem;
}
.divider {
  width: 60px; height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold), transparent);
  margin: 0 auto 0.9rem;
}
.card-license {
  font-size: clamp(0.85rem, 2.8vw, 1rem);
  color: var(--muted);
}
.card-license span {
  color: var(--gold);
  font-weight: 700;
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  margin-inline-start: 0.3rem;
}
.card-footer {
  display: flex;
  justify-content: space-between;
  font-size: clamp(0.65rem, 2vw, 0.8rem);
  color: var(--dim);
}
.card-footer i { color: var(--gold); margin-inline-end: 0.3rem; }

.back-inner {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 0.75rem;
}
.back-icon {
  font-size: clamp(2rem, 6vw, 2.75rem);
  color: var(--gold);
}
.back-name {
  font-size: clamp(1.1rem, 3.5vw, 1.35rem);
  font-weight: 700;
  color: var(--text);
}
.back-role {
  font-size: clamp(0.7rem, 2.2vw, 0.85rem);
  color: var(--muted);
  margin-bottom: 0.5rem;
}
.contact-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.6rem;
  width: 100%;
  margin-top: 0.5rem;
}
.contact-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.25rem;
  padding: 0.6rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  transition: all 0.3s;
}
.contact-item i {
  color: var(--gold);
  font-size: clamp(0.85rem, 2.5vw, 1rem);
}
.contact-item span {
  font-size: clamp(0.6rem, 1.8vw, 0.7rem);
  color: var(--muted);
}
.contact-item small {
  font-size: clamp(0.65rem, 2vw, 0.75rem);
  color: var(--text);
  direction: ltr;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.hint {
  position: fixed;
  bottom: 1.5rem;
  inset-inline-end: 1.5rem;
  font-size: 0.75rem;
  color: var(--dim);
  display: flex; align-items: center; gap: 0.5rem;
  padding: 0.6rem 1.2rem;
  border: 1px solid var(--line);
  border-radius: 100px;
  cursor: pointer;
  transition: all 0.3s;
}
.hint:hover { border-color: var(--gold); color: var(--gold); }
@media (max-width: 640px) {
  .card-footer { flex-direction: column; gap: 0.3rem; align-items: flex-start; }
}
</style>
</head>
<body>

<a href="index.html" class="back-btn">
  <i class="fas fa-arrow-right"></i> بازگشت
</a>

<div class="container">
  <div class="card-wrap">
    <div class="card" id="card">
      <!-- رو -->
      <div class="face front">
        <div class="card-header">
          <div class="logo">SK</div>
          <div class="badge">پایه یک</div>
        </div>
        <div class="card-body">
          <h2 class="card-name">سمیرا کریمی</h2>
          <p class="card-role">وکیل دادگستری</p>
          <div class="divider"></div>
          <p class="card-license">پروانه<span>۳۷۹۷۰</span></p>
        </div>
        <div class="card-footer">
          <span><i class="fas fa-phone"></i>۰۹۱۲۴۲۶۳۵۸۷</span>
          <span><i class="fas fa-gavel"></i>کانون مرکز</span>
        </div>
      </div>

      <!-- پشت -->
      <div class="face back">
        <div class="back-inner">
          <div class="back-icon">⚖️</div>
          <div class="back-name">سمیرا کریمی</div>
          <div class="back-role">وکیل پایه یک دادگستری</div>
          <div class="contact-list">
            <div class="contact-item">
              <i class="fas fa-phone"></i>
              <span>تلفن</span>
              <small>۰۹۱۲۴۲۶۳۵۸۷</small>
            </div>
            <div class="contact-item">
              <i class="fab fa-telegram"></i>
              <span>تلگرام</span>
              <small>@karimilawyer_ir</small>
            </div>
            <div class="contact-item">
              <i class="fab fa-whatsapp"></i>
              <span>واتساپ</span>
              <small>۰۹۱۲۴۲۶۳۵۸۷</small>
            </div>
            <div class="contact-item">
              <i class="far fa-envelope"></i>
              <span>ایمیل</span>
              <small>info@sk.ir</small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="hint" onclick="document.getElementById('card').classList.toggle('flipped')">
  <i class="fas fa-sync-alt"></i>
  <span>چرخش کارت</span>
</div>

<script>
document.getElementById('card').addEventListener('click', function() {
  this.classList.toggle('flipped');
});
</script>

</body>
</html>
